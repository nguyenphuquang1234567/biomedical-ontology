<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-label="Evidence layer: paper concepts, claims and citations"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#506481"/></marker></defs><rect width="1440" height="780" fill="#f8fafc"/><text x="44" y="48" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#152c48">Evidence layer: paper concepts, claims and citations</text><rect x="50" y="145" width="270" height="90" rx="12" fill="#e4eef8" stroke="#8299b5"/><text x="185.0" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#152c48">Document</text><text x="185.0" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334b68">Paper / versioned full text</text><rect x="580" y="145" width="270" height="90" rx="12" fill="#e4eef8" stroke="#8299b5"/><text x="715.0" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#152c48">EvidenceUnit</text><text x="715.0" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334b68">Text / table / figure</text><rect x="1110" y="145" width="270" height="90" rx="12" fill="#e4eef8" stroke="#8299b5"/><text x="1245.0" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#152c48">Claim</text><text x="1245.0" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334b68">Finding / method / hypothesis</text><rect x="580" y="390" width="270" height="90" rx="12" fill="#fff0d8" stroke="#8299b5"/><text x="715.0" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#152c48">EvidenceLink</text><text x="715.0" y="449" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334b68">Role: supports / contradicts</text><rect x="50" y="620" width="270" height="90" rx="12" fill="#fff0d8" stroke="#8299b5"/><text x="185.0" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#152c48">PaperConceptLink</text><text x="185.0" y="679" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334b68">Paper ↔ concept mapping</text><rect x="580" y="620" width="270" height="90" rx="12" fill="#e5f2e9" stroke="#8299b5"/><text x="715.0" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#152c48">OntologyConcept</text><text x="715.0" y="679" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334b68">Class or named concept</text><rect x="50" y="390" width="270" height="90" rx="12" fill="#e4eef8" stroke="#8299b5"/><text x="185.0" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#152c48">Citation</text><text x="185.0" y="449" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334b68">Actual reference record</text><path d="M580 190 L320 190" fill="none" stroke="#506481" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#263e5a" paint-order="stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round">evidence in</text><path d="M1110 165 L1110 95 L185 95 L185 145" fill="none" stroke="#506481" stroke-width="2" marker-end="url(#arrow)"/><text x="690" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#263e5a" paint-order="stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round">claim in</text><path d="M715 390 L715 235" fill="none" stroke="#506481" stroke-width="2" marker-end="url(#arrow)"/><text x="768" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#263e5a" paint-order="stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round">link evidence</text><path d="M850 435 L1245 435 L1245 235" fill="none" stroke="#506481" stroke-width="2" marker-end="url(#arrow)"/><text x="1045" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#263e5a" paint-order="stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round">link claim</text><path d="M185 390 L185 235" fill="none" stroke="#506481" stroke-width="2" marker-end="url(#arrow)"/><text x="249" y="321" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#263e5a" paint-order="stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round">citing document</text><path d="M50 435 L20 435 L20 190 L50 190" fill="none" stroke="#506481" stroke-width="2" marker-end="url(#arrow)"/><text x="175" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#263e5a" paint-order="stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round">cited document if resolved</text><path d="M320 650 L370 650 L370 260 L250 260 L250 235" fill="none" stroke="#506481" stroke-width="2" marker-end="url(#arrow)"/><text x="322" y="553" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#263e5a" paint-order="stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round">linked paper</text><path d="M320 665 L580 665" fill="none" stroke="#506481" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#263e5a" paint-order="stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round">linked concept</text><text x="50" y="755" font-family="Arial,sans-serif" font-size="16" fill="#334b68">Paper–concept mapping is many-to-many. A relevant paper is not necessarily a cited paper. Claims retain attribution and source context.</text></svg>