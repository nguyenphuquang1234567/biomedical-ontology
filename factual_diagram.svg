n</text><text x="870.0" y="159" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334b68">Repository run accession</text><rect x="1110" y="100" width="230" height="90" rx="12" fill="#e4eef8" stroke="#8299b5"/><text x="1225.0" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#152c48">ProcessingPipeline</text><text x="1225.0" y="159" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334b68">Software / reference build</text><rect x="755" y="790" width="230" height="90" rx="12" fill="#fff0d8" stroke="#8299b5"/><text x="870.0" y="825" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#152c48">SourceLocator</text><text x="870.0" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334b68">Sheet / cell / XML location</text><rect x="1110" y="790" width="230" height="90" rx="12" fill="#fff0d8" stroke="#8299b5"/><text x="1225.0" y="825" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#152c48">SourceAsset</text><text x="1225.0" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334b68">Versioned file / document</text><path d="M160 290 L160 190" fill="none" stroke="#506481" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#263e5a" paint-order="stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round">enrolled in</text><path d="M400 335 L275 335" fill="none" stroke="#506481" stroke-width="2" marker-end="url(#arrow)"/><text x="338" y="321" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#263e5a" paint-order="stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round">specimen from</text><path d="M755 335 L630 335" fill="none" stroke="#506481" stroke-width="2" marker-end="url(#arrow)"/><text x="692" y="321" text-ancho